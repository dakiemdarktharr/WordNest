name: Build and verify macOS app
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [codex/wordnest]
    paths: ['desktop/**', 'app/**', 'components/**', 'lib/**', 'hooks/**', 'public/**', 'scripts/**', 'tests/**', 'examples/**', 'build-resources/**', 'package*.json', 'index.html', 'vite.config.ts', 'tsconfig.json', 'electron-builder.config.mjs', '.github/workflows/macos.yml']
  pull_request:
    paths: ['desktop/**', 'app/**', 'components/**', 'lib/**', 'hooks/**', 'public/**', 'scripts/**', 'tests/**', 'examples/**', 'build-resources/**', 'package*.json', 'index.html', 'vite.config.ts', 'tsconfig.json', 'electron-builder.config.mjs', '.github/workflows/macos.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm run desktop:dist:mac -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Hash packages
        run: |
          node --input-type=module -e "import {writeFileSync,readFileSync} from 'node:fs';import {createHash} from 'node:crypto';import pkg from './package.json' with {type:'json'};const names=['dmg','zip'].map(ext=>'WordNest-'+pkg.version+'-'+process.arch+'.'+ext);writeFileSync('release/SHA256-macOS-'+process.arch+'.txt',names.map(n=>createHash('sha256').update(readFileSync('release/'+n)).digest('hex')+'  '+n).join('\n')+'\n');"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            release/WordNest-*.dmg
            release/WordNest-*.zip
            release/SHA256-macOS-*.txt
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          path: release
      - run: npm run test:mac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-evidence-${{ matrix.arch }}
          path: |
            outputs/mac-check-*/result.json
            outputs/mac-check-*/journey-*/result.json
          retention-days: 14
