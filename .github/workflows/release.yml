name: Publish desktop release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - shell: pwsh
        run: |
          Get-FileHash -LiteralPath (Get-ChildItem release\WordNest-Setup-*.exe).FullName -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii release\SHA256-Windows.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            release/WordNest-Setup-*.exe
            release/SHA256-Windows.txt
          if-no-files-found: error
  macos:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm run desktop:dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: shasum -a 256 release/WordNest-*.dmg release/WordNest-*.zip > release/SHA256-macOS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            release/WordNest-*.dmg
            release/WordNest-*.zip
            release/SHA256-macOS.txt
          if-no-files-found: error
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows
          path: release-assets/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-macos
          path: release-assets/macos
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/windows/* \
            release-assets/macos/* \
            examples/wordnest-demo.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "WordNest ${GITHUB_REF_NAME#v} — desktop apps" \
            --notes "Download the Windows .exe or the macOS .dmg for your Mac architecture. The app runs locally after installation; no localhost server is needed. See docs/INSTALL.vi.md for Vietnamese installation instructions."
