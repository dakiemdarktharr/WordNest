name: Publish desktop release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm run lint
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: ./scripts/installer-smoke.ps1
      - shell: pwsh
        run: |
          Get-FileHash -LiteralPath (Get-ChildItem release\WordNest-Setup-*.exe).FullName -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii release\SHA256-Windows.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            release/WordNest-Setup-*.exe
            release/SHA256-Windows.txt
          if-no-files-found: error
  macos:
    uses: ./.github/workflows/macos.yml
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows
          path: release-assets/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-macos-*
          merge-multiple: true
          path: release-assets/macos
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME!=='v'+p.version)process.exit(1)"
          gh release create "$GITHUB_REF_NAME" \
            release-assets/windows/* \
            release-assets/macos/* \
            examples/wordnest-demo.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "WordNest ${GITHUB_REF_NAME#v} — desktop apps" \
            --notes-file "docs/RELEASE-${GITHUB_REF_NAME#v}.md"
