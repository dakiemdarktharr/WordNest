name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [codex/wordnest]
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'hooks/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'build-resources/**'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'electron-builder.config.mjs'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'hooks/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'build-resources/**'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'electron-builder.config.mjs'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm run lint
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: ./scripts/installer-smoke.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WordNest-Windows-x64
          path: release/WordNest-Setup-*-x64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-test-evidence
          path: |
            outputs/desktop-smoke-*/
            outputs/installer-result.json
            outputs/journey-desktop/result.json
          retention-days: 7
